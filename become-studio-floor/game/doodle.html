
<div class="dwrap" id="doodle" hidden role="dialog" aria-modal="true" aria-label="Doodle Arcade">
  <div class="dbox">
    <div class="dtop">
      <b class="dlogo">DOODLE<span>ARCADE</span></b>
      <span class="dround" id="dRound"></span>
      <span class="dword" id="dWord" aria-live="polite"></span>
      <span class="dtimer" id="dTimer"></span>
      <button id="dClose" aria-label="Close the arcade">CLOSE ✕</button>
    </div>
    <div class="dmain">
      <aside class="dplayers" id="dPlayers" aria-label="Players"></aside>
      <section class="dstage">
        <div class="dcanvas-wrap" id="dWrap">
          <canvas id="dCv" width="160" height="120" aria-label="Drawing board"></canvas>
          <div class="doverlay" id="dOverlay"></div>
        </div>
        <div class="dtools" id="dTools"></div>
      </section>
      <aside class="dchat">
        <div class="dlog" id="dLog" aria-live="polite"></div>
        <form id="dForm" autocomplete="off"><input id="dInput" maxlength="60" placeholder="Type your guess…" aria-label="Guess or chat"><button>SEND</button></form>
      </aside>
    </div>
  </div>
</div>
