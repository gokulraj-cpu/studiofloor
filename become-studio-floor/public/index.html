<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23161926'/%3E%3Crect x='3' y='5' width='10' height='7' fill='%23ffcf4a'/%3E%3Crect x='5' y='7' width='2' height='2' fill='%23161926'/%3E%3Crect x='9' y='7' width='2' height='2' fill='%23161926'/%3E%3C/svg%3E">
<title>Become Studio Floor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=Silkscreen&display=swap">
<style>
  :root{
    color-scheme: dark;
    --ink:#161926; --frame:#1f2336; --panel:#262b44; --panel-2:#2e3452; --line:#3b4266;
    --paper:#f7efdc; --paper-ink:#2e2530;
    --text:#eef0f8; --muted:#a4aaca;
    --gold:#ffcf4a; --green:#6bd18a; --blue:#5fb4e8; --pink:#f29cb6; --violet:#b69cf0;
    --grey:#8d93b0; --dim:#5b607c; --red:#ef6b6b;
    --display:"Silkscreen", ui-monospace, "Courier New", monospace;
    --body:"Pixelify Sans", ui-rounded, system-ui, sans-serif;
  }
  [hidden]{display:none!important}
  html,body{height:100%}
  body{background:var(--ink);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.35;display:flex;flex-direction:column;padding-inline:16px;padding-block:12px;box-sizing:border-box;gap:12px;overflow:hidden}
  *{box-sizing:border-box}
  button{font:inherit;color:inherit;cursor:pointer}
  button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

  .px{background:var(--panel);box-shadow:0 0 0 2px var(--line), 4px 4px 0 2px #0b0d15}

  /* HUD */
  .hud{display:flex;align-items:center;gap:14px 20px;flex-wrap:wrap;padding:10px 14px}
  .brand{display:flex;align-items:baseline;gap:10px;min-width:0}
  .logo{font-family:var(--display);font-size:20px;letter-spacing:.02em;color:var(--paper)}
  .logo sup{font-size:.55em;color:var(--gold)}
  .brand .sub{color:var(--muted);font-size:13px;letter-spacing:.06em;text-transform:uppercase}
  .clock{display:flex;align-items:baseline;gap:8px;font-variant-numeric:tabular-nums}
  .clock b{font-family:var(--display);font-size:18px;color:var(--gold);font-weight:400}
  .clock span{color:var(--muted);font-size:13px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;background:var(--panel-2);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .chip i{width:8px;height:8px;display:inline-block}
  .chip b{font-weight:600}
  .src{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
  .src .dot{width:8px;height:8px;background:var(--grey)}
  .src.live .dot{background:var(--green);animation:blink 1.6s steps(2) infinite}
  .src.demo .dot{background:var(--gold)}
  .src.err .dot{background:var(--red)}
  @keyframes blink{50%{opacity:.25}}

  /* stage */
  .stage{flex:1;min-height:0;display:flex;gap:14px}
  .viewport{position:relative;flex:1;min-width:0;background:#10121c;overflow:hidden;touch-action:none}
  canvas{display:block;width:100%;height:100%;cursor:grab;image-rendering:pixelated}
  canvas.dragging{cursor:grabbing}
  .controls{position:absolute;right:10px;top:10px;display:flex;gap:6px}
  .controls button{background:var(--panel);box-shadow:0 0 0 2px var(--line), 2px 2px 0 2px #0b0d15;border:0;padding:4px 9px;font-family:var(--display);font-size:12px;min-width:30px}
  .controls button[aria-pressed="true"]{background:var(--gold);color:var(--paper-ink)}

  .banner{position:absolute;left:10px;top:10px;right:170px;max-width:520px;padding:10px 12px;background:var(--paper);color:var(--paper-ink);box-shadow:0 0 0 2px var(--paper-ink), 3px 3px 0 2px #0b0d15;font-size:14px;display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
  .banner p{margin:0;flex:1 1 240px}
  .banner button{background:var(--paper-ink);color:var(--paper);border:0;padding:4px 10px;font-size:13px}

  .tip{position:absolute;pointer-events:none;background:var(--paper);color:var(--paper-ink);padding:6px 8px;font-size:13px;box-shadow:0 0 0 2px var(--paper-ink);max-width:240px;z-index:3}
  .tip b{display:block;font-weight:600}

  .card{position:absolute;left:10px;bottom:96px;width:min(300px, calc(100% - 20px));background:var(--paper);color:var(--paper-ink);box-shadow:0 0 0 2px var(--paper-ink), 4px 4px 0 2px #0b0d15;padding:12px 14px;display:flex;flex-direction:column;gap:6px;z-index:2}
  .card h3{margin:0;font-family:var(--display);font-size:16px;font-weight:400;padding-right:24px}
  .card .role{font-size:13px;color:#6a5e66;margin-top:-4px}
  .card .row{display:flex;gap:8px;font-size:14px}
  .card .row span:first-child{color:#7c707a;width:62px;flex:none}
  .card .x{position:absolute;right:8px;top:6px;background:none;border:0;font-family:var(--display);font-size:14px;color:var(--paper-ink)}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;font-size:13px;color:#1b1c26;align-self:flex-start}

  /* side panel */
  .panel{width:290px;flex:none;display:flex;flex-direction:column;min-height:0}
  .panel header{padding:12px 14px 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .panel h2{margin:0;font-family:var(--display);font-size:14px;font-weight:400;letter-spacing:.04em}
  .panel header span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
  .list{overflow:auto;padding:0 8px 12px;display:flex;flex-direction:column;gap:10px}
  .group h4{margin:0 6px 4px;font-size:12px;font-weight:400;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;gap:6px;align-items:center}
  .group h4 i{width:8px;height:8px;display:inline-block}
  .person{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;padding:5px 6px}
  .person:hover,.person[aria-current="true"]{background:var(--panel-2)}
  .person .av{width:22px;height:22px;flex:none;image-rendering:pixelated}
  .person .nm{flex:1;min-width:0}
  .person .nm b{display:block;font-weight:400;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .person .nm small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .person .t{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

  /* 24h scrubber */
  .scrub{position:absolute;left:10px;right:10px;bottom:10px;z-index:2;display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--panel);box-shadow:0 0 0 2px var(--line), 3px 3px 0 2px #0b0d15}
  .scrub button{flex:none;border:0;background:var(--panel-2);box-shadow:0 0 0 2px var(--line);font-family:var(--display);font-size:12px;padding:5px 9px}
  .scrub button#play{width:34px}
  .scrub button#live[aria-pressed="true"]{background:var(--green);color:#10301b}
  .track{position:relative;flex:1;min-width:120px;height:40px}
  .sky{position:absolute;left:0;right:0;top:4px;height:14px;background:linear-gradient(90deg,#0d1030 0%,#0d1030 20%,#5a3a78 25%,#f0a070 29%,#9fd3ef 36%,#c9ecfa 50%,#9fd3ef 66%,#f09050 72.5%,#6a3f7a 77%,#151a45 81%,#0d1030 100%);box-shadow:0 0 0 2px #0b0d15}
  .future{position:absolute;top:4px;height:14px;right:0;pointer-events:none;background:repeating-linear-gradient(135deg, rgba(10,11,20,.55) 0 3px, rgba(10,11,20,.25) 3px 6px)}
  .marks{position:absolute;left:0;right:0;top:4px;height:14px;pointer-events:none}
  .marks i{position:absolute;top:0;width:2px;height:14px;background:rgba(107,209,138,.95)}
  .marks i.o{background:rgba(242,156,182,.9);height:8px;top:6px}
  .hours{position:absolute;left:0;right:0;top:22px;height:14px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;pointer-events:none}
  .hours span{position:absolute;transform:translateX(-50%)}
  .nowmark{position:absolute;top:0;width:2px;height:22px;background:var(--gold);pointer-events:none}
  .track input{position:absolute;inset:0;width:100%;height:24px;margin:0;background:transparent;-webkit-appearance:none;appearance:none;cursor:ew-resize}
  .track input::-webkit-slider-runnable-track{height:24px;background:transparent}
  .track input::-moz-range-track{height:24px;background:transparent}
  .track input::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:24px;background:var(--paper);box-shadow:0 0 0 2px #2e2530;border:0}
  .track input::-moz-range-thumb{width:10px;height:24px;background:var(--paper);box-shadow:0 0 0 2px #2e2530;border:0;border-radius:0}
  .track input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .readout{display:flex;flex-direction:column;min-width:190px;gap:1px}
  .readout b{font-family:var(--display);font-weight:400;font-size:15px;color:var(--gold);font-variant-numeric:tabular-nums}
  .readout span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px}
  @media (max-width: 640px){ .scrub{flex-wrap:wrap} .track{flex-basis:100%;order:3} .readout{flex:1} }

  /* Studio TV */
  .tvwrap{position:fixed;inset:0;z-index:20;background:rgba(10,11,20,.78);display:flex;align-items:center;justify-content:center;padding:16px}
  .tv{width:min(920px,100%);background:#1b1d29;padding:18px 18px 12px;box-shadow:0 0 0 3px #3b4266, 0 0 0 6px #0b0d15, 8px 8px 0 6px #07080e;display:flex;flex-direction:column;gap:10px}
  .tv-screen{--bg:#262b44;--ink:#eef0f8;--acc:#ffcf4a;position:relative;aspect-ratio:16/9;max-height:calc(100vh - 150px);width:100%;background:var(--bg);color:var(--ink);overflow:hidden;box-shadow:inset 0 0 0 3px rgba(0,0,0,.25);transition:background .35s steps(3)}
  .tv-screen::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg, rgba(0,0,0,.06) 0 2px, transparent 2px 4px)}
  .tv-screen[data-type="kudos"]{--bg:#ffcf4a;--ink:#2e2530;--acc:#2e2530}
  .tv-screen[data-type="launch"]{--bg:#5fb4e8;--ink:#0f2238;--acc:#0f2238}
  .tv-screen[data-type="win"]{--bg:#6bd18a;--ink:#10301b;--acc:#10301b}
  .tv-screen[data-type="milestone"]{--bg:#f29cb6;--ink:#3a1424;--acc:#3a1424}
  .tv-screen[data-type="welcome"]{--bg:#b69cf0;--ink:#231545;--acc:#231545}
  .tv-screen[data-type="news"]{--bg:#f7efdc;--ink:#2e2530;--acc:#c85a40}
  .slide{position:absolute;inset:0;padding:clamp(18px,4.5%,44px);display:flex;flex-direction:column;gap:clamp(8px,1.6vw,16px);animation:slideIn .45s steps(4)}
  @keyframes slideIn{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
  .slide .kicker{font-family:var(--display);font-size:clamp(11px,1.5vw,15px);letter-spacing:.08em;display:flex;align-items:center;gap:10px}
  .slide .kicker b{font-weight:400;background:var(--ink);color:var(--bg);padding:3px 8px}
  .slide h2{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(20px,4vw,42px);line-height:1.08;text-wrap:balance;max-width:22ch}
  .slide .body{margin:0;font-size:clamp(14px,1.9vw,21px);line-height:1.35;max-width:60ch;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
  .slide .by{margin-top:auto;font-size:clamp(12px,1.5vw,16px);opacity:.8;display:flex;gap:14px;flex-wrap:wrap}
  .slide .icon{position:absolute;right:clamp(14px,4%,40px);top:clamp(12px,4%,36px);font-size:clamp(34px,7vw,78px);line-height:1}
  .slide .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;max-width:760px}
  .slide .stat{background:rgba(255,255,255,.07);padding:10px 12px;display:flex;flex-direction:column;gap:2px}
  .slide .stat b{font-family:var(--display);font-weight:400;font-size:clamp(20px,3.2vw,34px);color:var(--acc);font-variant-numeric:tabular-nums}
  .slide .stat span{font-size:clamp(12px,1.4vw,15px);opacity:.85}
  .tv-bar{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(0,0,0,.18)}
  .tv-bar i{display:block;height:100%;width:0;background:var(--ink)}
  .tv-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .tv-controls .brandline{font-family:var(--display);font-size:12px;color:var(--muted);letter-spacing:.06em;margin-right:auto}
  .tv-controls span#tvCount{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:52px;text-align:center}
  .tv-controls button{background:var(--panel);box-shadow:0 0 0 2px var(--line);border:0;padding:4px 10px;font-family:var(--display);font-size:11px}
  .tv-controls button:hover{background:var(--panel-2)}
  .tvwrap:fullscreen{background:#07080e;padding:0}
  .tvwrap:fullscreen .tv{width:100%;height:100%;box-shadow:none;padding:0;background:#07080e}
  .tvwrap:fullscreen .tv-screen{max-height:none;flex:1;aspect-ratio:auto}
  .tvwrap:fullscreen .tv-controls{padding:6px 12px}
  @media (prefers-reduced-motion: reduce){ .slide{animation:none} .tv-screen{transition:none} }
  @media (max-width: 860px){
    body{overflow:auto;height:auto;min-height:100%}
    .stage{flex-direction:column}
    .viewport{flex:none;height:min(62vh,520px)}
    .panel{width:auto}
    .list{overflow:visible}
    .chips{margin-left:0}
    .banner{right:10px}
    .controls{top:auto;bottom:96px}
    .scrub .readout{min-width:0}
  }
  @media (prefers-reduced-motion: reduce){ .src.live .dot{animation:none} }
  body{margin:0}
  .banner form{display:flex;gap:8px;flex-wrap:wrap;align-items:center;flex:1 1 100%}
  .banner input{font:inherit;padding:4px 8px;border:2px solid var(--paper-ink);background:#fff;color:var(--paper-ink);min-width:0;flex:1 1 160px}
</style>
</head>
<body>

<header class="hud px">
  <div class="brand"><span class="logo">become<sup>®</sup></span><span class="sub">Studio floor</span></div>
  <div class="clock"><b id="clock">--:--</b><span id="date"></span><span>IST</span></div>
  <div class="src" id="src"><span class="dot"></span><span id="srcText">Connecting to Slack…</span></div>
  <div class="chips" id="chips"></div>
</header>

<main class="stage">
  <div class="viewport px" id="vp">
    <canvas id="cv" aria-label="Top-down pixel map of the Become studio showing where each team member is right now"></canvas>
    <div class="controls">
      <button id="zOut" aria-label="Zoom out">−</button>
      <button id="zIn" aria-label="Zoom in">+</button>
      <button id="zFit" aria-label="Fit office to screen">FIT</button>
      <button id="soundBtn" aria-pressed="false" aria-label="Office sound">♪ SOUND</button>
      <button id="tvBtn" aria-label="Open the studio TV">TV</button>
      <button id="names" aria-pressed="false">NAMES</button>
      <button id="proj" aria-pressed="false" title="Show what everyone is working on">PROJECTS</button>
    </div>
    <div class="banner" id="banner" hidden></div>
    <div class="tip" id="tip" hidden></div>
    <div class="card" id="card" hidden></div>
    <div class="scrub" id="scrub">
      <button id="play" aria-label="Replay today">▶</button>
      <div class="track">
        <div class="sky"></div><div class="future" id="future"></div><div class="marks" id="marks"></div><i class="nowmark" id="nowmark"></i>
        <div class="hours"><span style="left:0%;transform:none">00</span><span style="left:25%">06</span><span style="left:50%">12</span><span style="left:75%">18</span><span style="left:100%;transform:translateX(-100%)">24</span></div>
        <input type="range" id="time" min="0" max="1439" step="1" value="0" aria-label="Time of day. Drag to replay today.">
      </div>
      <div class="readout"><b id="scrubTime">LIVE</b><span id="recap">Drag the bar to replay today</span></div>
      <button id="live" aria-pressed="true">LIVE</button>
    </div>
  </div>
  <aside class="panel px" aria-label="Team list">
    <header><h2>TEAM</h2><span id="teamCount"></span></header>
    <div class="list" id="list"></div>
  </aside>
</main>

<div class="tvwrap" id="tv" hidden role="dialog" aria-modal="true" aria-label="Studio TV">
  <div class="tv">
    <div class="tv-screen" id="tvScreen" data-type="today" aria-live="polite">
      <div class="tv-bar"><i id="tvBar"></i></div>
    </div>
    <div class="tv-controls">
      <span class="brandline">BECOME® STUDIO TV</span>
      <button id="tvPrev" aria-label="Previous slide">◀ PREV</button>
      <span id="tvCount">1 / 1</span>
      <button id="tvNext" aria-label="Next slide">NEXT ▶</button>
      <button id="tvPause" aria-pressed="false">PAUSE</button>
      <button id="tvFull">FULL SCREEN</button>
      <button id="tvClose" aria-label="Close the TV">CLOSE ✕</button>
    </div>
  </div>
</div>

<script>
(() => {
"use strict";

/* ---------------- Team roster (from Slack) — desks assigned in this order ---------------- */
const ROSTER = [
  ["U09US6G61V4","Achuthan",""],
  ["U0A7L4VS1PS","Adithi","Junior Verbal Strategist"],
  ["U05E5KBAT26","Afri","Assoc. Brand Designer"],
  ["U093E411EUQ","Akshaya Natarajan",""],
  ["U05UDFQ1Z7A","Arun Sandeep","Assoc. Digital Strategist"],
  ["U07F37E4S12","Arun Thangavel","Founding Team – Frontrunner"],
  ["ULVHUR56Y","AV the Monk",""],
  ["U06CGR4RPGV","Gautham",""],
  ["U08VA01T7UZ","Gayathri Srinivasan","Market Research Analyst"],
  ["U08AU3DM092","Gokul","Product Design"],
  ["UB05U84LX","Harish Venkatesh","Founder & CEO"],
  ["USH087NMD","Indhu Kanth","Creative Director + Lead, Research"],
  ["U09US6FJHAA","Induja S","Client Partner | Account Manager"],
  ["U05F5TWC59B","Juhi","Growth"],
  ["U099E481108","Kajol Vakharia","Client Partner | Creative Project Manager"],
  ["U0ACYVBJBS5","Mo",""],
  ["U02MCTN385A","Pooja",""],
  ["U099E4897GQ","Pooja Raghu","Marketing & Content"],
  ["U099E470LM6","Praveen Kumar",""],
  ["U0A6NCL2FJR","Preetam Raaj",""],
  ["U022F2W0HHP","Preksha","Associate Digital Strategist"],
  ["U08DHB3TTFX","Prity Dhara","Webflow Developer"],
  ["U0145T9FDH8","Samshritha","Lead, Communication Strategy & Design"],
  ["U01CN2WA1T2","Samuel",""],
  ["U09ECQP5KDK","Shruti Ramnath","Graphic Designer"],
  ["U09US6GF20N","Soham","Brand & Type Designer"],
];
const SLACK = "Slack";
const CH_ATTENDANCE = "C01HXH115DH";  // #_attendance (Brisk jibble in/out)
const CH_LEAVES = "C0AC150KC5P";      // #_leaves (Brisk leave approvals)
const CH_GENERAL = "CAYDCHHGQ";       // #_general (news, kudos, launches)

/* ---------------- State vocabulary ---------------- */
const STATES = {
  desk:   {label:"At desk",        color:"#6bd18a", group:"In studio"},
  focus:  {label:"Heads down",     color:"#ffcf4a", group:"In studio"},
  remote: {label:"Working remote", color:"#b69cf0", group:"In studio"},
  meet:   {label:"On a call",      color:"#5fb4e8", group:"In a meeting"},
  away:   {label:"Away from desk", color:"#f29cb6", group:"Away from desk"},
  out:    {label:"Checked out",    color:"#8d93b0", group:"Checked out"},
  leave:  {label:"On leave",       color:"#5b607c", group:"On leave"},
  notin:  {label:"Not in yet",     color:"#454a66", group:"Not checked in"},
  loading:{label:"Connecting…",    color:"#454a66", group:"Connecting"},
};
const GROUP_ORDER = ["In studio","In a meeting","Away from desk","Checked out","On leave","Not checked in","Connecting"];
const GROUP_COLOR = {"In studio":"#6bd18a","In a meeting":"#5fb4e8","Away from desk":"#f29cb6","Checked out":"#8d93b0","On leave":"#5b607c","Not checked in":"#454a66","Connecting":"#454a66"};

/* ---------------- World geometry ---------------- */
const T = 16, MW = 48, MH = 30, WW = MW*T, WH = MH*T;
const TV_RECT = {x: 11*T - 4, y: 20*T - 6, w: 3*T + 8, h: 2*T + 4};
const P = (tx, ty) => ({x: tx*T, y: ty*T});

// Desks: 8 clusters of 4
const CLUSTERS = [];
for (const cy of [5, 13]) for (const cx of [3, 10, 17, 24]) CLUSTERS.push({cx, cy});
const DESKS = [];
CLUSTERS.forEach((cl, ci) => {
  const {cx, cy} = cl;
  [[0,"top"],[2,"top"],[0,"bot"],[2,"bot"]].forEach(([ox, side], k) => {
    const dx = (cx+ox)*T;
    const d = {n: DESKS.length+1, ci, side, dx, cy,
      rowY: side==="top" ? cy*T : (cy+1)*T,
      seat: side==="top"

const zoneOf = (x, y) => x < 31*T ? "work" : (y < 15*T ? "meet" : "lounge");

const nearest = (arr, v) => arr.reduce((a, b) => Math.abs(b-v) < Math.abs(a-v) ? b : a);

function inner(zone, a, b){
  if (zone === "work"){
    const ra = nearest(WORK_ROWS, a.y), rb = nearest(WORK_ROWS, b.y);
    if (ra === rb) return [{x:a.x, y:ra}, {x:b.x, y:rb}, b];
    const col = nearest(WORK_COLS, (a.x+b.x)/2);
    return [{x:a.x, y:ra}, {x:col, y:ra}, {x:col, y:rb}, {x:b.x, y:rb}, b];
  }
  const row = zone === "meet" ? 6.5*T : 17*T;
  return [{x:a.x, y:row}, {x:b.x, y:row}, b];
}
function route(a, b){
  const za = zoneOf(a.x, a.y), zb = zoneOf(b.x, b.y);
  if (za === zb) return inner(za, a, b);
  let pts = [];
  let cur = a, zc = za;
  if (zc !== "work"){ const d = DOORS[zc]; pts = pts.concat(inner(zc, cur, d.other), [d.work]); cur = d.work; zc = "work"; }
  if (zb === "work") return pts.concat(inner("work", cur, b));
  const d = DOORS[zb];
  return pts.concat(inner("work", cur, d.work), [d.other], inner(zb, d.other, b));
}

function classify(text, emojiName){

const PANTRY_SEATS = AWAY_SEATS.filter(s => s.where.startsWith("Pantry"));
const LOUNGE_SEATS = AWAY_SEATS.filter(s => !s.where.startsWith("Pantry"));
const isFood = p => /\b(lunch|breakfast|brunch|dinner|snack|coffee|tea|chai|food|eating|meal)\b/i.test(p.statusText || "") || /🍽|🍔|☕|🍵|🍕|🥪/u.test(p.statusEmoji || "");

  const keep = p => p.seat && p.seat.pool !== "desk" && want(p) === p.seat.pool && (p.seat.pool !== "away" || isFood(p) === inPantry(p.seat));

    const w = want(p); let seat = null;

function moveTo(p, seat, instant){

    else { p.visible = false; p.pos = null; p.path = []; }

/* ---------------- Parsing Slack payloads ---------------- */
function textOf(res){
  const p = res && res.payload;
  if (typeof p === "string") return p;
  if (p && typeof p === "object"){ for (const k of ["messages","result","results","text"]) if (typeof p[k] === "string") return p[k]; return JSON.stringify(p); }

function parseAttendance(text){
  const re = /<@(U[A-Z0-9]+)(?:\|[^>]*)?>\s*has jibbled (in|out) at (\d{1,2}:\d{2}\s?[AP]M)/g;
  const ev = []; let m; while ((m = re.exec(text))) ev.push({id:m[1], dir:m[2], time:m[3].replace(/^0/, "")});
  ev.reverse(); // channel reads newest first
  const out = {};
  for (const e of ev){
    const s = out[e.id] || (out[e.id] = {first:null, in:false, outAt:null, events:[]});
    s.events.push({dir: e.dir, min: toMin(e.time), time: e.time});

}

  const re = /<@(U[A-Z0-9]+)(?:\|[^>]*)?>\s*is on \*[^*]+\* for ([A-Z][a-z]{2} \d{1,2}, \d{4})/g;
  const set = new Set(); let m; while ((m = re.exec(text))) if (m[2] === todayLabel) set.add(m[1]);

}

  let raw = m[1].trim(), emojiName = "";
  const em = /^:([\w+\-]+):\s*/.exec(raw); if (em){ emojiName = em[1]; raw = raw.slice(em[0].length); }
  return {text: raw.trim(), emojiName, emoji: EMOJI[emojiName] || ""};

  const lines = String(text || "").split("\n").map(x => x.trim());
  const at = lines.findIndex(l => /@/.test(l) && !/\s/.test(l));
  const t = at > 0 ? lines[at - 1] : "";

async function startLive(){

  if (!mcp){ startDemo("Showing a sample office."); return; }
  mode = "live"; setSrc("live", "Reading Brisk check-ins…");

function subscribe(mcp){
  watches.forEach(u => u()); watches = [];
  dayKey = String(istMidnightEpoch());
  const oldest = String(istMidnightEpoch()/1000);
  const today = fmtLeave.format(new Date());
  let first = true;
  const handle = fn => ev => {
    if (mode !== "live") return;
    if (ev.type === "error"){
      const code = ev.error && ev.error.code;
      if (DENIALS.has(code)) return onDenied(code);

    }

  watches.push(mcp.watchTool(SLACK, "slack_read_channel", {channel_id: CH_ATTENDANCE, oldest, limit: 100, response_format: "concise"},
    handle(res => {

/* ---- Paced Slack queue: one background call at a time ---- */
let mcpRef = null;
const slowQ = []; let slowBusy = false, slowPauseUntil = 0;
function enqueue(key, tool, input, onOk, opt = {}){

  slowBusy = true; const job = slowQ.shift();
  try {
    const res = await mcpRef.callTool(SLACK, job.tool, job.input, job.fresh ? {cache: false} : {cache: {staleTime: 60000}});
    job.onOk(res);
  } catch (e){
    const code = e && e.code;
    if (DENIALS.has(code)){ slowBusy = false; slowQ.length = 0; onDenied(code); return; }
    slowPauseUntil = Date.now() + Math.min(60000, (e && e.retryAfterMs) || 20000);   // back off, then carry on

    live.statuses[p.id] = next; const ti = parseTitle(textOf(res)); if (ti) p.title = ti;
    if (live.attOk && (!prev || prev.text !== next.text || prev.emojiName !== next.emojiName)) scheduleRecompute();

}
let rrIdx = 0, rrOthers = 0;
function statusTick(){

  const inStudio = people.filter(p => live.att[p.id] && live.att[p.id].in);
  if (inStudio.length && (rrOthers++ % 15)) enqueueStatus(inStudio[rrIdx++ % inStudio.length]);
  else { const rest = people.filter(p => !(live.att[p.id] && live.att[p.id].in)); if (rest.length) enqueueStatus(rest[rrIdx++ % rest.length]); }
}
function queueStatuses(){

  for (const p of order) enqueue("st:" + p.id, "slack_read_user_profile", {user_id: p.id, response_format: "concise"}, res => {

    res => { live.selfLines = parseLinesResults(textOf(res)); });
}
function queueActivity(){

/* ---- What people are working on: their recent public-channel activity ---- */
const IGNORE_CH = /^_|general|random|announce|attendance|leave|fun|social|watercooler|celebrat|birthday|memes?$|^dev-talk$/i;

function cleanText(t){

function parseActivity(text){

function drawSprite(c, p, x, y, face, seated, t, moving){
  const L = p.look; x = Math.round(x); y = Math.round(y);

}

  const cross = (o, a, b) => (a[0]-o[0])*(b[1]-o[1]) - (a[1]-o[1])*(b[0]-o[0]);

function tvClean(t){
  return String(t)
    .replace(/<#C[A-Z0-9]+\|([^>]+)>/g, "#$1").replace(/<#C[A-Z0-9]+>/g, "another project")
    .replace(/<@U[A-Z0-9]+\|([^>]+)>/g, "$1").replace(/<@U[A-Z0-9]+>/g, "someone")

}
function parseGeneral(text){

  const out = []; const re = /(?:^|\n\n)([^\n]*?)(?: <[^>\s]+@[^>\s]+>)?: ([\s\S]*?) \[(\d{4}-\d{2}-\d{2}) (\d{2}):(\d{2}):\d{2} IST\]/g; let m;

function firstSentence(s){

  const m = /^(.{12,90}?[.!?])(\s|$)/.exec(one);
  if (m) return {title: m[1], rest: one.slice(m[1].length).trim()};

}

function toSlide(msg){
  const when = fmtDay.format(new Date(msg.date + "T00:00:00Z"));
  const k = /\*?([^*\n]+?)\*? celebrated \*?([^*\n]+?)\*? for being \*?([^*\n]+?)\*?\s*\n`([\s\S]*?)`/.exec(msg.raw);
  if (k) return {type:"kudos", title:`${k[2].trim()} is ${k[3].trim()}`, body: tvClean(k[4]), by:`From ${k[1].trim()}`, when};
  const clean = tvClean(msg.raw);
  if (clean.length < 12) return null;
  let type = null;
  if (/anniversary|years? at become|\bpromot/i.test(clean)) type = "milestone";
  else if (/\b(it'?s live|is live|went live|now live|launched|shipped|is out|published)\b/i.test(clean)) type = "launch";
  else if (/\bwelcome\b/i.test(clean) && /(team|aboard|join|family)/i.test(clean)) type = "welcome";
  else if (/congrat|proud|magical|kudos|\bwins?\b|milestone|celebrat|amazing week|bringing the elephant|nailed|well done/i.test(clean)) type = "win";
  else if (/weekly edition|newsletter|announcing|we have signed|onboarded|new client/i.test(clean)) type = "news";
  if (!type) return null;
  if (/salary|payroll|reimburse|invoice|password|credentials/i.test(clean)) return null;

    if (on && ac && scene().pantry && scene().level && Math.random() < 0.5){
      const s = ac.createBufferSource(); s.buffer = white; const f = ac.createBiquadFilter(); f.type = "highpass"; f.frequency.value = 1400;
      const g = ac.createGain(), t = ac.currentTime; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.012, t + 0.4); g.gain.linearRampToValueAtTime(0.009, t + 2); g.gain.linearRampToValueAtTime(0, t + 2.8);
      s.connect(f).connect(g); out(g, 25 * T); s.start(t, 0, 3);
    }
    loops.push(setTimeout(coffee, rand(18000, 40000)));
  }
  function setOn(v){
    on = v;
    if (v && !started){ started = true; build(); }
    if (!ac) return;
    if (v){ ac.resume(); master.gain.cancelScheduledValues(ac.currentTime); master.gain.setTargetAtTime(0.9, ac.currentTime, 0.6); }
    else { master.gain.setTargetAtTime(0, ac.currentTime, 0.25); }
  }
  document.addEventListener("visibilitychange", () => { if (!ac) return; if (document.hidden) ac.suspend(); else if (on) ac.resume(); });
  return {
    toggle(){ setOn(!on); return on; },
    get on(){ return on; },
    chime(){ if (!on || !ac) return; play(tone(659, 0, 0.35, 0.03, "triangle"), ENTRANCE.x); play(tone(523, 0.16, 0.5, 0.03, "triangle"), ENTRANCE.x); },
    jingle(){ if (!on || !ac) return; [523, 659, 784, 1047].forEach((f, i) => play(tone(f, i * 0.07, 0.16, 0.018, "square"))); },
    blip(x){ if (!on || !ac) return; play(tone(880, 0, 0.06, 0.008, "square", 1320), x); },
  };
})();
const soundBtn = document.getElementById("soundBtn");
soundBtn.onclick = () => { const v = Sound.toggle(); soundBtn.setAttribute("aria-pressed", String(v)); soundBtn.textContent = v ? "♪ SOUND ON" : "♪ SOUND"; };

/* ---------------- Standalone data: this site's own Slack functions ---------------- */
const KEY_STORE = "become-studio-key";
let officeKey = ""; try { officeKey = localStorage.getItem(KEY_STORE) || ""; } catch (_) {}
async function api(path){
  const r = await fetch(path, {headers: officeKey ? {"x-office-key": officeKey} : {}, cache: "no-store"});
  if (r.status === 401){ const e = new Error("passcode"); e.code = "passcode"; throw e; }
  const j = await r.json().catch(() => ({}));
  if (!r.ok){ const e = new Error(j.message || j.error || String(r.status)); e.code = j.error || "upstream"; throw e; }
  return j;
}
function askPasscode(wrong){
  pollers.forEach(clearInterval); pollers = [];
  banner.innerHTML = "";
  const f = document.createElement("form");
  const p = document.createElement("p"); p.textContent = wrong ? "That passcode didn't work. Check it and try again." : "Enter the studio passcode to see who's in today.";
  const i = document.createElement("input"); i.type = "password"; i.id = "passcode"; i.autocomplete = "current-password"; i.setAttribute("aria-label", "Studio passcode");
  const b = document.createElement("button"); b.type = "submit"; b.textContent = "Enter";
  f.append(p, i, b);
  f.addEventListener("submit", ev => { ev.preventDefault(); officeKey = i.value.trim(); try { localStorage.setItem(KEY_STORE, officeKey); } catch (_) {} banner.hidden = true; startStandalone(); });
  banner.append(f); banner.hidden = false; setSrc("err", "Locked"); setTimeout(() => i.focus(), 50);
}
let pollers = [];
function setupCopy(code, msg){
  if (code === "missing_token") return "This site isn't connected to Slack yet. Add SLACK_BOT_TOKEN in Netlify → Site configuration → Environment variables, then redeploy.";
  if (code === "not_in_channel" || code === "channel_not_found") return "The Slack app can't read the Brisk channels yet. Invite it to #_attendance, #_leaves and #_general (type /invite @Studio Floor in each).";
  if (code === "invalid_auth" || code === "token_revoked" || code === "not_authed") return "Slack rejected the token. Reinstall the Slack app and update SLACK_BOT_TOKEN in Netlify.";
  if (code === "missing_scope") return "The Slack app is missing a permission. Recreate it from slack-app-manifest.yml and reinstall.";
  return `Couldn't reach Slack just now (${msg}). Showing a sample office; reload to try again.`;
}
async function startStandalone(){
  if (location.protocol === "file:"){ startDemo("This local copy has no server behind it, so it's showing a sample office."); return; }
  let d;
  try { d = await api("/api/office"); }
  catch (e){ if (e.code === "passcode") return askPasscode(!!officeKey); return startDemo(setupCopy(e.code, e.message)); }
  mode = "live"; banner.hidden = true; applyOffice(d, true);
  pollers.forEach(clearInterval);
  pollers = [
    setInterval(() => api("/api/office").then(x => applyOffice(x, false)).catch(onPollError), 30000),
    setInterval(loadFeed, 600000),
    setInterval(loadActivity, 900000),
  ];
  loadFeed(); loadActivity();
}
function onPollError(e){ if (e.code === "passcode") return askPasscode(true); stale = true; updateSrc(); }
function applyOffice(d, first){
  if (mode !== "live") return;
  live.att = d.attendance || {};
  live.leaves = new Set(d.leaves || []);
  live.statuses = {};
  for (const [id, st] of Object.entries(d.statuses || {})) live.statuses[id] = {text: st.text || "", emojiName: st.emojiName || "", emoji: EMOJI[st.emojiName] || ""};
  for (const [id, t] of Object.entries(d.titles || {})) if (byId[id]) byId[id].title = t;
  live.attOk = true; lastUpdate = d.at || Date.now(); stale = false; updateSrc();
  recompute(first);
}
async function loadFeed(){
  try {
    const d = await api("/api/feed");
    generalMsgs = d.messages || []; rebuildSlides();
    const sl = {};
    for (const [id, msgs] of Object.entries(d.lines || {})){ const list = []; for (const m of msgs) for (const l of splitLines(m)) if (list.length < 6 && !list.includes(l)) list.push(l); sl[id] = list; }
    live.selfLines = sl;
    if (!tvEl.hidden) tvCount.textContent = `${tvIdx + 1} / ${tvSlides.length}`;
  } catch (e){ if (e.code === "passcode") askPasscode(true); }
}
async function loadActivity(){
  try {
    const d = await api("/api/activity");
    for (const p of people){
      const a = (d.people || {})[p.id];
      if (!a){ p.projects = []; p.project = ""; p.lastMsg = null; continue; }
      p.projects = a.projects || []; p.project = p.projects[0] ? prettyChannel(p.projects[0]) : "";
      let t = a.lastMsg ? cleanText(a.lastMsg.text) : "";
      if (t.length > 110) t = t.slice(0, 107).trimEnd() + "…";
      p.lastMsg = t ? {ch: a.lastMsg.ch, text: t} : null;
    }
    scheduleList();
  } catch (e){ if (e.code === "passcode") askPasscode(true); }
}

/* ---------------- Clock ---------------- */
function clock(){ const n = new Date(); document.getElementById("clock").textContent = fmtClock.format(n); document.getElementById("date").textContent = fmtDate.format(n); updateSrc(); }
setInterval(clock, 15000); clock();

/* ---------------- Boot ---------------- */
drawStatic();
buildCasters();
recompute(true);
requestAnimationFrame(tick);
updateScrubUI();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { for (const k in avatarCache) delete avatarCache[k]; renderList(); });
startStandalone();
})();
</script>
