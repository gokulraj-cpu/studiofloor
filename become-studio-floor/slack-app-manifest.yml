display_information:
  name: Studio Floor
  description: Reads Brisk check-ins, leave and statuses for the Become Studio Floor.
  background_color: "#161926"
features:
  bot_user:
    display_name: Studio Floor
    always_online: false
oauth_config:
  scopes:
    bot:
      - channels:history
      - channels:read
      - channels:join
      - groups:history
      - users:read
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
